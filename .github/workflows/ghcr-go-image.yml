name: Go worker image to GHCR

# Fork-only: builds dockerfiles/go.Dockerfile for the Go SDK version in mise.toml and pushes
# ghcr.io/<owner>/omes:<sha>-go-<sdk version>, the same tag scheme as temporaliotest/omes on Docker Hub.
# Packages start private on GHCR; make the package public once so clusters can pull it without credentials.

permissions:
  contents: read
  packages: write

# workflow_dispatch only shows up for workflows on the default branch, so fork branches build on push.
on:
  push:
    branches: ["fix/**"]
  workflow_dispatch:

jobs:
  push:
    name: Build and push Go image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout omes repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          sdk=$(sed -n '/^\[_.sdk\]/,/^\[/s/^go = "\(.*\)"/\1/p' mise.toml)
          [ -n "$sdk" ] || { echo "no [_.sdk] go version in mise.toml" >&2; exit 1; }
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/omes:$(git rev-parse --short=7 HEAD)-go-$sdk"
          docker buildx build --platform linux/amd64 \
            --build-arg SDK_VERSION="$sdk" \
            --label io.temporal.sdk.version="$sdk" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            -f dockerfiles/go.Dockerfile -t "$image" --push .
          echo "::notice title=GHCR image::$image"
